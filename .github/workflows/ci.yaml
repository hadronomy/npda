name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify C++ interfaces and behavior
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install LLVM 23 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 clang-format-23 clang-tidy-23 lld-23 libclang-rt-23-dev libc++-23-dev libc++abi-23-dev
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 23 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@23 || brew install llvm
          if brew --prefix llvm@23 >/dev/null 2>&1; then
            echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
          else
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          fi

      - name: Check formatting
        run: |
          clang-format --version
          find src include tests -type f \( -name '*.h' -o -name '*.cc' \) -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Build and verify release
        run: |
          xmake f -m release --sanitize=n -y
          xmake build -y
          xmake project -k compile_commands
          xmake test

      - name: Check names and direct includes
        run: |
          find src tests -name '*.cc' -print0 | xargs -0 -n 1 clang-tidy -p . --warnings-as-errors='*'

      - name: Build and verify with sanitizers
        run: |
          xmake f -m debug --sanitize=y -y
          xmake build -y
          xmake test
